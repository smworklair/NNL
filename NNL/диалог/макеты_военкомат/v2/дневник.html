<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme:dark)">
<title>Дневник давления — Справка по годности</title>
<style>
:root{
  --шрифт:Aptos,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  --фон:#f5f5f3;--пов:#fff;--пов2:#ecece9;--поле:#fff;--пуз:#ecece9;
  --чернила:#141414;--чер2:#4d4d4a;--тих:#8a8a85;--тише:#9c9c97;
  --вол:rgba(0,0,0,.1);--вол2:rgba(0,0,0,.2);--навед:rgba(0,0,0,.06);
  --подтв:#237a47;--сам:#8a6400;--сбой:#c62828;--сбой-ф:rgba(198,40,40,.08);
  --шип:rgba(0,0,0,.06);color-scheme:light}
@media(prefers-color-scheme:dark){:root{
  --фон:#121212;--пов:#1a1a1a;--пов2:#232323;--поле:#1f1f1f;--пуз:#282826;
  --чернила:#f1f1ef;--чер2:#b9b9b6;--тих:#85857f;--тише:#6f6f68;
  --вол:rgba(255,255,255,.09);--вол2:rgba(255,255,255,.2);--навед:rgba(255,255,255,.07);
  --подтв:#5fd08a;--сам:#f5cf2e;--сбой:#ff6b6b;--сбой-ф:rgba(255,107,107,.12);
  --шип:rgba(255,255,255,.05);color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:16px/1.5 var(--шрифт);background:var(--фон);color:var(--чернила);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--чернила);outline-offset:2px;border-radius:8px}
.и{width:16px;height:16px;display:block;flex:none}
.т{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;background:var(--фон);position:relative;overflow:hidden}
@media(min-width:700px){.т{max-width:680px}}
.ш{flex:none;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px 14px}
.лого{display:flex;align-items:center;gap:9px;min-width:0}
.лого svg{width:26px;height:20px;flex:none}
.лого h1{font-size:15px;font-weight:700;letter-spacing:.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.кш{min-height:44px;padding:0 12px;border-radius:12px;color:var(--чер2);font-size:14px}
.кш:hover{background:var(--навед);color:var(--чернила)}
.сегмент{flex:none;display:flex;gap:4px;margin:0 12px 8px;padding:4px;border-radius:16px;background:var(--пуз);border:1px solid var(--вол)}
.сегмент a{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:13.5px;color:var(--тих);text-decoration:none}
.сегмент a:hover{color:var(--чернила)}
.сегмент a[aria-current="page"]{background:var(--пов);color:var(--чернила);font-weight:650;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.тело{flex:1;overflow-y:auto;padding:6px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.карт{background:var(--пов);border:1px solid var(--вол);border-radius:18px;padding:14px;margin:0 0 12px}
.карт h2{margin:0 0 10px;font-size:15.5px;font-weight:650}
.подп{margin:0;font-size:12.5px;color:var(--тих)}
.поля2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.поле-б{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.поле-б:last-of-type{margin-bottom:0}
.метка{font-size:12px;color:var(--тих)}
.поле-б input{min-height:48px;width:100%;border:1px solid var(--вол2);border-radius:13px;background:var(--поле);color:var(--чернила);font:16px var(--шрифт);padding:0 12px;outline:none}
.поле-б input:focus{border-color:var(--чернила)}
.пер{display:flex;gap:6px}
.пер-кн{flex:1;min-height:48px;border:1px solid var(--вол2);border-radius:13px;font-size:14px;color:var(--тих);background:var(--поле)}
.пер-кн.в{background:var(--чернила);color:var(--фон);border-color:transparent;font-weight:600}
.ошибка{margin:8px 0 0;font-size:12.5px;color:var(--сбой)}
.кн{min-height:44px;padding:0 16px;border-radius:13px;font-size:14.5px;border:1px solid var(--вол2);background:var(--пов);color:var(--чернила)}
.кн.гл{background:var(--чернила);color:var(--фон);border-color:transparent}
.кн:disabled{background:var(--пуз);color:var(--тише);border-color:transparent}
.свод-цифры{display:flex;align-items:baseline;gap:10px;margin:2px 0 4px}
.свод-цифры b{font-size:30px;font-weight:700;letter-spacing:-.01em}
.свод-цифры span{font-size:12.5px;color:var(--тих);line-height:1.35}
.граф{margin:10px 0 0}
.граф svg{width:100%;height:64px;display:block}
.заголовок-дня{margin:16px 4px 6px;font-size:12.5px;color:var(--тише)}
.з-строка{display:flex;align-items:center;gap:10px;background:var(--пов);border:1px solid var(--вол);border-radius:14px;padding:6px 6px 6px 12px;margin:0 0 8px}
.з-чип{font-size:11.5px;color:var(--тих);border:1px solid var(--вол2);border-radius:8px;padding:3px 7px;flex:none}
.з-цифры{font-size:15px;font-weight:650}
.з-цифры.высокое{color:var(--сам)}
.з-пул{font-size:12.5px;color:var(--тише);white-space:nowrap}
.уд{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--тише);flex:none;margin-left:auto}
.уд:hover{background:var(--навед);color:var(--сбой)}
.пусто-п{margin:8px 4px;font-size:14px;color:var(--тих);line-height:1.6}
.к-очистить{display:block;margin:16px auto 4px;color:var(--тише);font-size:13px;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 10px}
.к-очистить.опасно{color:var(--сбой)}
.снос{margin:14px 4px 0;text-align:center;color:var(--тише);font-size:11.5px;line-height:1.5}
.тост{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:var(--чернила);color:var(--фон);border-radius:12px;padding:10px 16px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}
.тост.в{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){.тост{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="и-знак" viewBox="0 0 26 20"><rect y="7" width="26" height="13" rx="2" fill="currentColor"/><circle cx="7" cy="4" r="3.4" fill="currentColor"/><circle cx="19" cy="4" r="3.4" fill="var(--сам)"/></symbol>
<symbol id="и-крест" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></symbol>
</defs></svg>

<main class="т">
  <header class="ш">
    <span class="лого"><svg><use href="#и-знак"/></svg><h1>Справка по годности</h1></span>
  </header>
  <nav class="сегмент" aria-label="Разделы">
    <a href="index.html">Разбор</a>
    <a href="дневник.html" aria-current="page">Дневник</a>
    <a href="заявления.html">Заявления</a>
  </nav>
  <div class="тело">
    <section class="карт" id="сводка" hidden></section>
    <section class="карт">
      <h2>Добавить замер</h2>
      <div class="поля2">
        <label class="поле-б" style="margin-bottom:0"><span class="метка">Дата</span><input type="date" id="ф-дата"></label>
        <div class="поле-б" style="margin-bottom:0"><span class="метка">Когда</span>
          <div class="пер" id="пер" role="group" aria-label="Время замера">
            <button class="пер-кн в" data-пер="утро" aria-pressed="true">Утро</button>
            <button class="пер-кн" data-пер="вечер" aria-pressed="false">Вечер</button>
          </div>
        </div>
      </div>
      <div class="поля2">
        <label class="поле-б" style="margin-bottom:0"><span class="метка">Верхнее, мм рт. ст.</span><input type="number" inputmode="numeric" id="ф-с" placeholder="150" min="60" max="300"></label>
        <label class="поле-б" style="margin-bottom:0"><span class="метка">Нижнее, мм рт. ст.</span><input type="number" inputmode="numeric" id="ф-н" placeholder="95" min="30" max="200"></label>
      </div>
      <label class="поле-б"><span class="метка">Пульс (необязательно)</span><input type="number" inputmode="numeric" id="ф-п" placeholder="85" min="30" max="220"></label>
      <p class="ошибка" id="ф-ошибка" hidden></p>
      <button class="кн гл" id="ф-добавить" style="width:100%" disabled>Добавить замер</button>
    </section>
    <section id="гр-список"></section>
    <button class="к-очистить" id="к-очистить" hidden>Очистить всё</button>
    <p class="снос">Замеры хранятся только на этом устройстве и не заменяют заключение врача.<br>От 140/90 значения выделены цветом.</p>
  </div>
</main>
<div class="тост" id="тост" role="status"></div>
<script>
(function(){
"use strict";
function $(ид){return document.getElementById(ид)}
var фДата=$('ф-дата'),фС=$('ф-с'),фН=$('ф-н'),фП=$('ф-п'),фОшибка=$('ф-ошибка'),фДобавить=$('ф-добавить'),
сводка=$('сводка'),грСписок=$('гр-список'),кОчистить=$('к-очистить'),тостЭ=$('тост'),пер=$('пер');
var КЛЮЧ='справка_дневник_v2';
var период='утро',ждётОчистку=false,тостТ=null;
function э(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function и(имя){return '<svg class="и" aria-hidden="true"><use href="#'+имя+'"/></svg>'}
/* --- хранилище --- */
function чтение(){try{var с=JSON.parse(localStorage.getItem(КЛЮЧ)||'null');return Array.isArray(с)?с:[]}catch(е){return[]}}
function запись(){try{localStorage.setItem(КЛЮЧ,JSON.stringify(замеры))}catch(е){}}
function идНовый(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
/* --- даты --- */
function строкаДаты(д){return д.getFullYear()+'-'+('0'+(д.getMonth()+1)).slice(-2)+'-'+('0'+д.getDate()).slice(-2)}
function сегодня(){return строкаДаты(new Date())}
function сдвигДней(н){var д=new Date();д.setDate(д.getDate()+н);return строкаДаты(д)}
function датаЧисло(с){var ч=String(с).split('-');return new Date(+ч[0],+ч[1]-1,+ч[2])}
function надписьДаты(с){
  if(с===сегодня())return 'Сегодня';
  if(с===сдвигДней(-1))return 'Вчера';
  var д=датаЧисло(с),год=д.getFullYear()!==new Date().getFullYear();
  return ('0'+д.getDate()).slice(-2)+'.'+('0'+(д.getMonth()+1)).slice(-2)+(год?'.'+д.getFullYear():'');
}
/* --- пример --- */
function пример(){
  function з(н,ч,с,н2,п){return {и:идНовый(),д:сдвигДней(-н),ч:ч,с:с,н:н2,п:п}}
  return [з(4,'утро',152,95,88),з(4,'вечер',148,93,86),
          з(3,'утро',150,94,87),з(3,'вечер',146,92,84),
          з(2,'утро',151,95,85),з(2,'вечер',147,93,83),
          з(1,'утро',151,95,86),з(1,'вечер',147,93,84)];
}
var замеры=чтение();
if(!замеры.length&&localStorage.getItem(КЛЮЧ)===null){замеры=пример();запись()}
/* --- сводка и график --- */
function замеров(к){var х=к%100;if(х>=11&&х<=14)return 'замеров';var у=к%10;if(у===1)return 'замер';if(у>=2&&у<=4)return 'замера';return 'замеров'}
function средние(мас){
  var с=0,н=0,п=0,сп=0;
  мас.forEach(function(з){с+=з.с;н+=з.н;if(з.п){п+=з.п;сп++}});
  return {с:Math.round(с/мас.length),н:Math.round(н/мас.length),п:сп?Math.round(п/сп):null,к:мас.length};
}
function сортировка(а,б){if(а.д!==б.д)return а.д<б.д?-1:1;return (а.ч==='утро'?0:1)-(б.ч==='утро'?0:1)}
function последниеСАД(н){return замеры.slice().sort(сортировка).slice(-н).map(function(з){return з.с})}
function график(значения){
  if(!значения.length)return '';
  var мин=Math.min.apply(null,значения),макс=Math.max.apply(null,значения),р=(макс-мин)||1;
  var т=значения.map(function(v,i){
    var x=значения.length>1?10+260*i/(значения.length-1):140;
    var y=56-(v-мин)/р*48;
    return [x,y];
  });
  var линия=т.map(function(п){return п[0].toFixed(1)+','+п[1].toFixed(1)}).join(' ');
  var посл=т[т.length-1];
  return '<svg viewBox="0 0 280 64" preserveAspectRatio="none" aria-hidden="true">'
  +'<polyline points="'+линия+'" fill="none" stroke="var(--чернила)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>'
  +'<circle cx="'+посл[0]+'" cy="'+посл[1]+'" r="3.5" fill="var(--сам)"/></svg>';
}
function рендерСводки(){
  if(!замеры.length){сводка.hidden=true;return}
  сводка.hidden=false;
  var граница=датаЧисло(сдвигДней(-6));
  var недавние=замеры.filter(function(з){return датаЧисло(з.д)>=граница});
  var база=недавние.length?недавние:замеры;
  var ср=средние(база),точки=последниеСАД(14);
  сводка.innerHTML='<h2>Средние '+(недавние.length?'за 7 дней':'по всем замерам')+'</h2>'
  +'<div class="свод-цифры"><b>'+ср.с+'/'+ср.н+'</b><span>мм рт. ст.<br>по '+ср.к+' '+замеров(ср.к)+'</span></div>'
  +(ср.п?'<p class="подп">Средний пульс — '+ср.п+'</p>':'')
  +'<div class="граф">'+график(точки)+'</div>'
  +'<p class="подп" style="margin-top:6px">Верхнее давление · последние '+точки.length+' '+замеров(точки.length)+'</p>';
}
/* --- список --- */
function рендерСписка(){
  if(!замеры.length){
    грСписок.innerHTML='<p class="пусто-п">Пока пусто. Добавьте первый замер — он сохранится только на этом устройстве.</p>';
    return;
  }
  var сорт=замеры.slice().sort(function(а,б){return -сортировка(а,б)});
  var ч='',прошл='';
  сорт.forEach(function(з){
    if(з.д!==прошл){прошл=з.д;ч+='<p class="заголовок-дня">'+э(надписьДаты(з.д))+'</p>'}
    var выс=(з.с>=140||з.н>=90)?' высокое':'';
    ч+='<div class="з-строка"><span class="з-чип">'+э(з.ч)+'</span><span class="з-цифры'+выс+'">'+з.с+'/'+з.н+'</span>'
    +(з.п?'<span class="з-пул">пульс '+з.п+'</span>':'')
    +'<button class="уд" data-уд="'+э(з.и)+'" aria-label="Удалить замер">'+и('и-крест')+'</button></div>';
  });
  грСписок.innerHTML=ч;
}
function рендер(){рендерСводки();рендерСписка();кОчистить.hidden=!замеры.length}
/* --- форма --- */
function значения(){
  var п=фП.value.trim();
  return {с:parseInt(фС.value,10),н:parseInt(фН.value,10),п:п===''?null:parseInt(п,10)};
}
function проверка(){
  var з=значения(),ош=[];
  if(фС.value!==''&&!(з.с>=60&&з.с<=300))ош.push('верхнее — от 60 до 300');
  if(фН.value!==''&&!(з.н>=30&&з.н<=200))ош.push('нижнее — от 30 до 200');
  if(фП.value!==''&&!(з.п>=30&&з.п<=220))ош.push('пульс — от 30 до 220');
  var готов=з.с>=60&&з.с<=300&&з.н>=30&&з.н<=200&&(з.п===null||(з.п>=30&&з.п<=220));
  фДобавить.disabled=!готов;
  if(ош.length){фОшибка.hidden=false;фОшибка.textContent='Проверьте числа: '+ош.join(', ')+'.'}
  else фОшибка.hidden=true;
}
фС.addEventListener('input',проверка);
фН.addEventListener('input',проверка);
фП.addEventListener('input',проверка);
фДобавить.addEventListener('click',function(){
  if(фДобавить.disabled)return;
  var з=значения();
  замеры.push({и:идНовый(),д:фДата.value||сегодня(),ч:период,с:з.с,н:з.н,п:з.п});
  запись();рендер();тост('Замер добавлен');
  фС.value='';фН.value='';фП.value='';проверка();
});
пер.addEventListener('click',function(е){
  var к=е.target.closest('[data-пер]');if(!к)return;
  период=к.getAttribute('data-пер');
  Array.prototype.forEach.call(пер.querySelectorAll('[data-пер]'),function(б){
    var в=б.getAttribute('data-пер')===период;
    б.classList.toggle('в',в);б.setAttribute('aria-pressed',в?'true':'false');
  });
});
/* --- удаление --- */
document.addEventListener('click',function(е){
  var у=е.target.closest('[data-уд]');
  if(у){замеры=замеры.filter(function(з){return з.и!==у.getAttribute('data-уд')});запись();рендер();тост('Замер удалён');return}
});
кОчистить.addEventListener('click',function(){
  if(!ждётОчистку){
    ждётОчистку=true;кОчистить.classList.add('опасно');
    кОчистить.textContent='Нажмите ещё раз, чтобы стереть все замеры';
    setTimeout(function(){if(ждётОчистку){ждётОчистку=false;кОчистить.classList.remove('опасно');кОчистить.textContent='Очистить всё'}},4000);
    return;
  }
  ждётОчистку=false;кОчистить.classList.remove('опасно');кОчистить.textContent='Очистить всё';
  замеры=[];запись();рендер();тост('Все замеры удалены');
});
/* --- тост --- */
function тост(т){тостЭ.textContent=т;тостЭ.classList.add('в');clearTimeout(тостТ);тостТ=setTimeout(function(){тостЭ.classList.remove('в')},2200)}
/* --- старт --- */
фДата.value=сегодня();фДата.max=сегодня();
рендер();проверка();
})();
</script>
</body></html>
